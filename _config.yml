title: Página de c04tl
tagline: Powered by guacamole
description: Ciberseguridad, Linux y CTF.
url: https://c04tl.github.io
lang: es
timezone: America/Mexico_City
author: Luis Medina
plugins: [jekyll-archives, jekyll-feed, jekyll-seo-tag, jekyll-sitemap, jemoji]
collections:
  tabs:
    output: true
    permalink: /:title/
  recursos:
    output: false
defaults:
  - scope: {path: "", type: posts}
    values: {layout: post, permalink: "/posts/:title/", toc: true}
  - scope: {path: "", type: tabs}
    values: {layout: page}
jekyll-archives:
  enabled: [categories, tags]
  layouts: {category: taxonomy, tag: taxonomy}
  permalinks: {category: "/categories/:name/", tag: "/tags/:name/"}
sass:
  style: compressed
exclude: [tools, docs, README.md, LICENSE, checker, vendor]
